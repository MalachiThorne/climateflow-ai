version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: climateflow
      POSTGRES_USER: climateflow
      POSTGRES_PASSWORD: climateflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climateflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Override DATABASE_URL to point at the local Postgres container
      DATABASE_URL: postgresql://climateflow:climateflow@db:5432/climateflow
      NODE_ENV: development

volumes:
  postgres_data:
